# ============================================================================
#  每日增量采集 → 入库 → 导出 JSON → 提交仓库 → 发布 GitHub Pages
#
#  关于 cron 时区（重要）
#  ---------------------------------------------------------------------------
#  GitHub Actions 的 schedule **一律按 UTC 解释**，不跟随仓库时区。
#  所以「北京时间每天 00:00」不能写 "0 0 * * *"（那是 UTC 00:00 = 北京 08:00），
#  正确写法是 "0 16 * * *"（UTC 16:00 = 北京次日 00:00）。
#  另外定时任务在仓库 60 天无活动后会被自动停用，请留意。
#
#  采集量控制
#  ---------------------------------------------------------------------------
#  定时任务默认走 --rotate-daily 28：每天只抓「今天轮到」的那约 22 所学校，
#  28 天正好覆盖全部 620 所。单次约 1 分钟，不会一次打满目标站点，
#  也不会浪费时间重抓没变化的内容（SHA-256 内容指纹会把它们判为未变更）。
#
#  免费额度
#  ---------------------------------------------------------------------------
#  每月 2000 分钟。本任务单次约 1~3 分钟，每天一次 ≈ 30~90 分钟/月，绰绰有余。
#  因此加了 timeout-minutes 兜底，避免异常卡死把额度跑光。
# ============================================================================

name: update-data

on:
  schedule:
    # UTC 16:00 == 北京时间次日 00:00
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      years:
        description: "年份，逗号分隔（留空用仓库默认）"
        required: false
        default: ""
      schools:
        description: "学校代码，逗号分隔（留空则按天轮转 28 天覆盖全校）"
        required: false
        default: ""
      force:
        description: "忽略内容哈希强制重抓"
        type: boolean
        default: false
      with_wechat:
        description: "同时跑公众号抽取（需要 DEEPSEEK_API_KEY）"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "crawler/**"
      - "pipeline/**"
      - "config/**"
      - "db/**"
      - "scripts/**"
      - "web/**"
      - ".github/workflows/update-data.yml"

# 同一时间只跑一个采集，避免并发写库/写文件互相踩
concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write      # 提交数据
  pages: write         # 发布 Pages
  id-token: write

jobs:
  # ------------------------------------------------------------------ 采集
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 页面结构漂移的早期预警：解析器是基于真实页面快照写的离线回归，
      # 这一步失败说明考试院页面结构变了，后面的采集必然解析不到数据。
      - name: 解析器回归测试（页面结构哨兵）
        run: python tests/test_parse.py

      - name: 采集 + 入库 + 导出 JSON
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GAOKAO_CONCURRENCY: "4"      # 并发 ≤ 5，对目标站点友好
          GAOKAO_DELAY: "1.0"          # 基础延迟 ≥ 1s
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.years }}" ]; then
            ARGS="$ARGS --years ${{ github.event.inputs.years }}"
          fi
          if [ -n "${{ github.event.inputs.schools }}" ]; then
            # 手动指定了学校：只抓这些
            ARGS="$ARGS --schools ${{ github.event.inputs.schools }}"
          else
            # 定时任务：按天轮转，每天只抓今天轮到的那一批（约 22 所 / 1 分钟）
            ARGS="$ARGS --rotate-daily 28"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          if [ "${{ github.event.inputs.with_wechat }}" = "true" ]; then
            ARGS="$ARGS --with-wechat"
          fi
          echo "运行参数: $ARGS"
          python scripts/run_all.py $ARGS

      # 前端数据契约测试：确保导出的 JSON 满足页面假设（列定义、行长度、位次单调）
      - name: 前端数据契约测试
        run: node tests/data_contract.test.mjs

      - name: 展示数据统计
        run: python scripts/run_all.py --status

      # 数据产物（库 + JSON）回写仓库，既是缓存也是 Pages 的内容来源
      - name: 提交数据变更
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data web/data
          if git diff --staged --quiet; then
            echo "没有数据变更，跳过提交"
          else
            git commit -m "chore(data): 每日增量更新 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: 打包 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  # ------------------------------------------------------------------ 发布
  deploy:
    needs: crawl
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# ============================================================================
#  想「按学校分别设置采集计划」？把 crawl 任务改成矩阵即可，例如：
#
#    strategy:
#      fail-fast: false
#      max-parallel: 2                  # 同时最多 2 个矩阵任务，整体仍受站点限速约束
#      matrix:
#        schools: ["1021,1023,1025", "1028,1029,1030", "1047,1048,1049"]
#    ...
#    run: python scripts/run_all.py --schools ${{ matrix.schools }}
#
#  各矩阵任务各自写 data/ 会冲突，因此矩阵模式下建议：
#    1) 每个分片导出到独立产物（upload-artifact），或
#    2) 只用矩阵做采集、把 JSON 导出放到后面的单独 job 里串行执行。
# ============================================================================
